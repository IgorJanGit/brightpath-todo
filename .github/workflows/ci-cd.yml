name: CI/CD

# Every push to main: test -> build the image -> wait for the server to deploy
# it -> verify the live /health reports the new commit.
#
# Deployment itself is pull-based: the EC2 instance checks GitHub every minute
# and deploys the newest commit on main once the "test" job below succeeds
# (deploy/poll.sh). No AWS credentials are stored in GitHub.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:  # the server only deploys commits where this job's check run succeeded
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: todo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U todo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://todo:ci-only-password@localhost:5432/todo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r app/requirements-dev.txt
      - run: pytest -v app/tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image (same Dockerfile the server builds)
        run: docker build -t todo-app:${{ github.sha }} .

  verify-deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the server to pick up and deploy this commit
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          WANT="${GITHUB_SHA::7}"
          for i in $(seq 1 40); do   # up to ~10 minutes
            BODY=$(curl -fsS --max-time 10 "$APP_URL/health" || true)
            echo "$(date +%T) $BODY"
            if echo "$BODY" | jq -e --arg v "$WANT" '.status == "ok" and .version == $v' >/dev/null 2>&1; then
              echo "Live and healthy at $WANT"
              exit 0
            fi
            sleep 15
          done
          echo "Server did not report $WANT as healthy in time (a newer push may have superseded it)" >&2
          exit 1
